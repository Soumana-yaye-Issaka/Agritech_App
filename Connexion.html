<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulair de Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="Connexion.Css">
  </head>
  <body>

    <div class="container d-flex align-items-center justify-content-center">
        <div class="Logo"><img src="Images/favico.png" alt=""></div>
        <h2>Agritech-App</h2>
    </div>

   <div class="container d-flex justify-content-center align-items-center">

     <form class="col-12 col-lg-6 p-4 text-white rounded" action="" style="background-color: #1D3D14;">
        <h4 class="d-flex justify-content-center align-items-center">Login</h4>
        <div>
            <div class="mb-3">
                <label for="formGroupExampleInput" class="form-label">Veuillez saisir votre email</label>
                <input type="email" class="form-control" id="formGroupExampleInput" placeholder="email">
            </div>
            <div class="mb-3">
                <label for="formGroupExampleInput2" class="form-label">Veuillez saisir votre mot de passe</label>
                <input type="password" class="form-control" id="formGroupExampleInput2" placeholder="Mot de passe ">
            </div>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2">
            <label class="form-check-label" for="radioDefault2">
              Se souvenir de moi 
            </label>
        </div>

        <div class="col-auto d-flex justify-content-end ">
            <button type="submit" class="btn btn-success"><a class="nav-link" href="index.html">Login <i class="bi bi-arrow-up-right"></i></a></button>
        </div>
        <div class="mt-2">
            <p>Veuillez contacter un administrateur si vous avez oublié votre mot de passe </p>
        </div>
    </form>

   </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
